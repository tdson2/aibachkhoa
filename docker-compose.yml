services:
  web:
    build: .
    image: aibachkhoa-landing:latest
    container_name: aibachkhoa-web
    restart: unless-stopped
    init: true                      # tini làm PID 1 -> xử lý SIGTERM, tắt container gọn gàng
    environment:
      NODE_ENV: production
      PORT: 3000
      # Where the analytics events are written. Must be the volume below:
      # the rest of the filesystem is read-only.
      ANALYTICS_DIR: /app/data
      ANALYTICS_RETENTION_DAYS: 90
      # The one password for /admin. Put it in a .env file next to this one;
      # leaving it unset does not stop the site, it only leaves the dashboard
      # closed and showing how to set it.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # The only writable path in the container.
      - analytics-data:/app/data
    ports:
      # cloudflared chạy trên host -> trỏ tunnel tới http://localhost:3000
      # Chỉ bind vào localhost nên port KHÔNG lộ ra Internet, dù firewall có mở.
      - "127.0.0.1:3000:3000"
    # ----- Hardening -----
    read_only: true                 # filesystem chỉ đọc, mã nguồn không thể bị ghi đè
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  analytics-data:
